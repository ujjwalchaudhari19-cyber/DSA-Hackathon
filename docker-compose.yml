version: "3.9"

# ============================================================
# GramUdyam AI — One-command development stack
# Usage:  docker-compose up
# ============================================================

services:
  # ── Python FastAPI backend (api/) ─────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gramudyam_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./app.db}
      - ENV=${ENV:-dev}
    volumes:
      - ./api:/app
      - api_data:/app/app.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── React frontend (web/) ──────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gramudyam_web
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0

volumes:
  api_data:
